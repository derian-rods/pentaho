services:
  repository:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    container_name: pentaho-repository
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      HIBERNATE_DB: ${HIBERNATE_DB}
      HIBERNATE_USER: ${HIBERNATE_USER}
      HIBERNATE_PASSWORD: ${HIBERNATE_PASSWORD}
      QUARTZ_DB: ${QUARTZ_DB}
      QUARTZ_USER: ${QUARTZ_USER}
      QUARTZ_PASSWORD: ${QUARTZ_PASSWORD}
      JACKRABBIT_DB: ${JACKRABBIT_DB}
      JACKRABBIT_USER: ${JACKRABBIT_USER}
      JACKRABBIT_PASSWORD: ${JACKRABBIT_PASSWORD}
      TZ: ${TZ}
    volumes:
      - pentaho-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - pentaho-net

  pentaho-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pentaho-server
    restart: unless-stopped
    depends_on:
      repository:
        condition: service_healthy
    environment:
      HIBERNATE_DB: ${HIBERNATE_DB}
      HIBERNATE_USER: ${HIBERNATE_USER}
      HIBERNATE_PASSWORD: ${HIBERNATE_PASSWORD}
      QUARTZ_DB: ${QUARTZ_DB}
      QUARTZ_USER: ${QUARTZ_USER}
      QUARTZ_PASSWORD: ${QUARTZ_PASSWORD}
      JACKRABBIT_DB: ${JACKRABBIT_DB}
      JACKRABBIT_USER: ${JACKRABBIT_USER}
      JACKRABBIT_PASSWORD: ${JACKRABBIT_PASSWORD}
      PENTAHO_MIN_MEMORY: ${PENTAHO_MIN_MEMORY}
      PENTAHO_MAX_MEMORY: ${PENTAHO_MAX_MEMORY}
      TZ: ${TZ}
    ports:
      - "${PENTAHO_HTTP_PORT}:8080"
    volumes:
      - pentaho-jackrabbit-data:/opt/pentaho-server/pentaho-solutions/system/jackrabbit/repository
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -L http://localhost:8080/pentaho/"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 240s
    networks:
      - pentaho-net

networks:
  pentaho-net:
    name: pentaho-net

volumes:
  pentaho-postgres-data:
    name: pentaho-postgres-data
  pentaho-jackrabbit-data:
    name: pentaho-jackrabbit-data
